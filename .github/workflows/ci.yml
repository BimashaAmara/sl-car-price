name: CI - retrain, test and monitor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
      DAGSHUB_REPO: ${{ vars.DAGSHUB_REPO }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Retrain + quality gate (fails if test MAPE > 20%) + log to MLflow
        run: python train.py
      - name: Tests
        run: pytest -q
      - name: Drift check
        run: python drift_check.py
      - name: Docker image builds and answers
        run: |
          docker build -t sl-car-price .
          docker run -d -p 8501:8501 sl-car-price
          for _ in $(seq 1 30); do curl -sf localhost:8501/_stcore/health && break; sleep 2; done
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            model.pkl
            metrics.json
            drift_report.html
